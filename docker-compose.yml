version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: edt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=db
      - DB_NAME=edt_db
      - DB_USER=admin
      - DB_PASSWORD=admin123
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data: